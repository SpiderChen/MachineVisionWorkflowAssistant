name: Build App (Windows + macOS)

on:
  push:
    branches: [main]
    tags: ["v*"]
  workflow_dispatch: # 允许在 Actions 页手动触发

permissions:
  contents: write # 打 v* tag 时创建 Release 需要写权限

# 同一分支/tag 的新构建自动取消上一次未完成的运行，避免卡队的 job 越堆越多
concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip wheel
          pip install -r requirements.txt
          pip install pyinstaller
      - name: Build EXE
        run: pyinstaller MachineVisionWorkflowAssistant.spec --noconfirm --clean
      - name: Assemble release bundle
        shell: pwsh
        run: |
          $rel = "release/MachineVisionWorkflowAssistant"
          New-Item -ItemType Directory -Force -Path $rel | Out-Null
          Copy-Item dist/MachineVisionWorkflowAssistant.exe $rel/
          Copy-Item config.yaml $rel/
          Copy-Item README.md $rel/
          Copy-Item -Recurse samples $rel/samples
          Compress-Archive -Path "$rel/*" -DestinationPath "release/MachineVisionWorkflowAssistant-windows.zip" -Force
      - name: Upload EXE artifact
        uses: actions/upload-artifact@v4
        with:
          name: MachineVisionWorkflowAssistant-windows-exe
          path: dist/MachineVisionWorkflowAssistant.exe
          if-no-files-found: error
      - name: Upload Windows bundle
        uses: actions/upload-artifact@v4
        with:
          name: MachineVisionWorkflowAssistant-windows-bundle
          path: release/MachineVisionWorkflowAssistant-windows.zip
          if-no-files-found: error

  # Apple Silicon（macos-14）：稳定，作为 macOS 的主构建，参与发布门禁
  build-macos-arm64:
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip wheel
          pip install -r requirements.txt
          pip install "pyobjc-framework-Cocoa" "pyobjc-framework-Quartz"
          pip install pyinstaller
      - name: Build .app
        run: pyinstaller MachineVisionWorkflowAssistant.spec --noconfirm --clean
      - name: Ad-hoc codesign (无开发者证书，仅让 Gatekeeper 少报错)
        run: codesign --force --deep --sign - "dist/MachineVisionWorkflowAssistant.app" || true
      - name: Zip .app bundle
        run: |
          cd dist
          ditto -c -k --sequesterRsrc --keepParent \
            "MachineVisionWorkflowAssistant.app" \
            "../MachineVisionWorkflowAssistant-macos-arm64.zip"
      - name: Upload .app artifact
        uses: actions/upload-artifact@v4
        with:
          name: MachineVisionWorkflowAssistant-macos-arm64
          path: MachineVisionWorkflowAssistant-macos-arm64.zip
          if-no-files-found: error

  # Intel（macos-13）：GitHub 构建机紧缺、常排长队。设为「尽力而为」：
  # continue-on-error 不影响整体结论、40min 运行上限、且不进发布门禁（见 release.needs）。
  build-macos-intel:
    runs-on: macos-13
    continue-on-error: true
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip wheel
          pip install -r requirements.txt
          pip install "pyobjc-framework-Cocoa" "pyobjc-framework-Quartz"
          pip install pyinstaller
      - name: Build .app
        run: pyinstaller MachineVisionWorkflowAssistant.spec --noconfirm --clean
      - name: Ad-hoc codesign (无开发者证书，仅让 Gatekeeper 少报错)
        run: codesign --force --deep --sign - "dist/MachineVisionWorkflowAssistant.app" || true
      - name: Zip .app bundle
        run: |
          cd dist
          ditto -c -k --sequesterRsrc --keepParent \
            "MachineVisionWorkflowAssistant.app" \
            "../MachineVisionWorkflowAssistant-macos-intel.zip"
      - name: Upload .app artifact
        uses: actions/upload-artifact@v4
        with:
          name: MachineVisionWorkflowAssistant-macos-intel
          path: MachineVisionWorkflowAssistant-macos-intel.zip
          if-no-files-found: error

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    # 只依赖稳定的两个构建；Intel 若卡队/失败不会阻塞发布（其产物若已就绪仍会被收进来）
    needs: [build-windows, build-macos-arm64]
    runs-on: ubuntu-latest
    steps:
      - name: Download all available artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts
      - name: Publish Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release create "$GITHUB_REF_NAME" \
            artifacts/*/* \
            --repo "$GITHUB_REPOSITORY" \
            --title "$GITHUB_REF_NAME" \
            --generate-notes
