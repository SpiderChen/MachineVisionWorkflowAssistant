name: Build Windows EXE

on:
  push:
    branches: [main]
    tags: ["v*"]
  workflow_dispatch: # 允许在 Actions 页手动触发

permissions:
  contents: write # 打 v* tag 时创建 Release 需要写权限

jobs:
  build:
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip wheel
          pip install -r requirements.txt
          pip install pyinstaller

      - name: Build EXE
        run: pyinstaller MachineVisionWorkflowAssistant.spec --noconfirm --clean

      - name: Assemble release bundle
        shell: pwsh
        run: |
          $rel = "release/MachineVisionWorkflowAssistant"
          New-Item -ItemType Directory -Force -Path $rel | Out-Null
          Copy-Item dist/MachineVisionWorkflowAssistant.exe $rel/
          Copy-Item config.yaml $rel/
          Copy-Item README.md $rel/
          Copy-Item -Recurse samples $rel/samples
          Compress-Archive -Path "$rel/*" -DestinationPath "release/MachineVisionWorkflowAssistant-windows.zip" -Force

      - name: Upload EXE artifact
        uses: actions/upload-artifact@v4
        with:
          name: MachineVisionWorkflowAssistant-exe
          path: dist/MachineVisionWorkflowAssistant.exe
          if-no-files-found: error

      - name: Upload release bundle
        uses: actions/upload-artifact@v4
        with:
          name: MachineVisionWorkflowAssistant-windows-bundle
          path: release/MachineVisionWorkflowAssistant-windows.zip
          if-no-files-found: error

      - name: Publish Release (on v* tag)
        if: startsWith(github.ref, 'refs/tags/v')
        shell: pwsh
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release create $env:GITHUB_REF_NAME `
            dist/MachineVisionWorkflowAssistant.exe `
            release/MachineVisionWorkflowAssistant-windows.zip `
            --title $env:GITHUB_REF_NAME --generate-notes
