name: Build App (Windows + macOS)

on:
  push:
    branches: [main]
    tags: ["v*"]
  workflow_dispatch: # 允许在 Actions 页手动触发

permissions:
  contents: write # 打 v* tag 时创建 Release 需要写权限

# 同一分支/tag 的新构建自动取消上一次未完成的运行，避免卡队的 job 越堆越多
concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-windows:
    # windows-2022 比 windows-latest 的构建基线更保守；同时打 x64/x86，覆盖现代
    # 64 位系统、仍在使用的 32 位系统，以及 Windows on ARM 的 x86 模拟层。
    runs-on: windows-2022
    timeout-minutes: 35
    strategy:
      fail-fast: false
      matrix:
        architecture: [x64, x86]
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          # Python 3.10 是当前依赖仍完整提供 x86/x64 轮子的最保守共同基线，
          # 对 Windows Server 2016 也比新解释器更稳。
          python-version: "3.10"
          architecture: ${{ matrix.architecture }}
          cache: pip
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip wheel
          pip install -r requirements.txt
          pip install pyinstaller==6.21.0
          python -c "import platform, struct; print(platform.platform()); print('Python bits:', struct.calcsize('P') * 8)"
      - name: Build EXE
        shell: pwsh
        run: |
          pyinstaller MachineVisionWorkflowAssistant.spec --noconfirm --clean 2>&1 |
            Tee-Object -FilePath pyinstaller-windows.log
          if ($LASTEXITCODE -ne 0) {
            $tail = (Get-Content pyinstaller-windows.log -Tail 80).ForEach({
              $_.Replace("%", "%25").Replace("`r", "%0D").Replace("`n", "%0A")
            }) -join "%0A"
            Write-Output "::error title=Windows PyInstaller failed::$tail"
            exit $LASTEXITCODE
          }
      - name: Verify packaged OCR runtime
        shell: pwsh
        run: |
          $exe = "dist/MachineVisionWorkflowAssistant/MachineVisionWorkflowAssistant.exe"
          $log = "dist/MachineVisionWorkflowAssistant/logs/app.log"
          $status = "dist/MachineVisionWorkflowAssistant/logs/ocr-self-test.status"
          Remove-Item $log, $status -Force -ErrorAction SilentlyContinue
          $env:MVWA_OCR_SELF_TEST = "1"
          $proc = Start-Process `
            -FilePath $exe `
            -ArgumentList "--ocr-self-test" `
            -PassThru

          # 原生清理线程偶尔不会自行结束。这里不把“进程退出”误当作验收条件，
          # 而是等待 EXE 独立写出的推理成功哨兵；哨兵不依赖 logging。
          $passed = $false
          $deadline = [DateTime]::UtcNow.AddMinutes(5)
          while ([DateTime]::UtcNow -lt $deadline) {
            if (Test-Path $status) {
              $passed = Select-String -Path $status -SimpleMatch "passed" -Quiet
              if ($passed) { break }
            }
            $proc.Refresh()
            if ($proc.HasExited) { break }
            Start-Sleep -Seconds 2
          }

          if (Test-Path $log) {
            Get-Content $log -Tail 80
          }
          if (Test-Path $status) {
            Write-Output "OCR self-test stages: $((Get-Content $status) -join ' -> ')"
          }
          $proc.Refresh()
          if ($passed) {
            if (-not $proc.HasExited) {
              Stop-Process -Id $proc.Id -Force -ErrorAction SilentlyContinue
            }
            Write-Output "Packaged OCR inference passed on Windows ${{ matrix.architecture }}"
            exit 0
          }
          if (-not $proc.HasExited) {
            Stop-Process -Id $proc.Id -Force -ErrorAction SilentlyContinue
            $stages = if (Test-Path $status) {
              (Get-Content $status) -join " -> "
            } else { "no status file" }
            Write-Output "::error title=Packaged OCR self-test timed out::Last stages: $stages"
            exit 124
          }
          if ($proc.ExitCode -ne 0) {
            Write-Output "::error title=Packaged OCR self-test failed::Exit code $($proc.ExitCode); see Windows diagnostics artifact"
            exit $proc.ExitCode
          }
          Write-Output "::error title=Packaged OCR self-test failed::Process exited without the OCR success marker"
          exit 3
      - name: Upload Windows diagnostics on failure
        if: failure()
        uses: actions/upload-artifact@v5
        with:
          name: MachineVisionWorkflowAssistant-windows-${{ matrix.architecture }}-diagnostics
          path: |
            pyinstaller-windows.log
            dist/MachineVisionWorkflowAssistant/logs/app.log
            dist/MachineVisionWorkflowAssistant/startup_error.log
          if-no-files-found: ignore
          retention-days: 7
      - name: Assemble release bundle
        shell: pwsh
        run: |
          $rel = "release/MachineVisionWorkflowAssistant"
          New-Item -ItemType Directory -Force -Path $rel | Out-Null
          Copy-Item -Recurse "dist/MachineVisionWorkflowAssistant/*" $rel/
          Copy-Item config.yaml $rel/
          Copy-Item README.md $rel/
          Copy-Item WINDOWS.md $rel/
          Copy-Item -Recurse samples $rel/samples
          Compress-Archive -Path "$rel/*" -DestinationPath "release/MachineVisionWorkflowAssistant-windows-${{ matrix.architecture }}.zip" -Force
      - name: Upload Windows bundle
        uses: actions/upload-artifact@v5
        with:
          name: MachineVisionWorkflowAssistant-windows-${{ matrix.architecture }}-bundle
          path: release/MachineVisionWorkflowAssistant-windows-${{ matrix.architecture }}.zip
          if-no-files-found: error

  # Apple Silicon（macos-14）：稳定，作为 macOS 的主构建，参与发布门禁
  build-macos-arm64:
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.11"
          cache: pip
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip wheel
          pip install -r requirements.txt
          pip install "pyobjc-framework-Cocoa" "pyobjc-framework-Quartz"
          pip install pyinstaller
      - name: Build .app
        run: pyinstaller MachineVisionWorkflowAssistant.spec --noconfirm --clean
      - name: Ad-hoc codesign (无开发者证书，仅让 Gatekeeper 少报错)
        run: codesign --force --deep --sign - "dist/MachineVisionWorkflowAssistant.app" || true
      - name: Zip .app bundle
        run: |
          cd dist
          ditto -c -k --sequesterRsrc --keepParent \
            "MachineVisionWorkflowAssistant.app" \
            "../MachineVisionWorkflowAssistant-macos-arm64.zip"
      - name: Upload .app artifact
        uses: actions/upload-artifact@v5
        with:
          name: MachineVisionWorkflowAssistant-macos-arm64
          path: MachineVisionWorkflowAssistant-macos-arm64.zip
          if-no-files-found: error

  # universal2（在 macos-14 arm64 机上构建，彻底绕开紧缺的 Intel 构建机队列）：
  # onnxruntime/opencv/Qt 绑定无 universal2 轮子，故不能靠 target_arch=universal2 一把梭；
  # 改为原生 arm64 + Rosetta 下 x86_64 各打一份 .app，再 lipo 合并成胖二进制 → Intel 与
  # Apple Silicon 通吃。暂设「尽力而为」（continue-on-error，不进发布门禁），跑稳后再收编。
  build-macos-universal:
    runs-on: macos-14
    continue-on-error: true
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v5
      - name: 确保 Rosetta 2（运行 x86_64 Python 需要）
        run: softwareupdate --install-rosetta --agree-to-license || true
      - name: 安装 uv
        uses: astral-sh/setup-uv@v6
      - name: 构建 arm64 切片
        run: |
          uv python install cpython-3.11-macos-aarch64
          uv venv --python cpython-3.11-macos-aarch64 .venv-arm
          uv pip install --python .venv-arm/bin/python -r requirements.txt \
            "pyobjc-framework-Cocoa" "pyobjc-framework-Quartz" pyinstaller
          .venv-arm/bin/python -c "import platform; print('arm 切片解释器架构=', platform.machine())"
          .venv-arm/bin/pyinstaller MachineVisionWorkflowAssistant.spec \
            --noconfirm --clean --distpath dist-arm --workpath build-arm
      - name: 构建 x86_64 切片（Rosetta）
        run: |
          uv python install cpython-3.11-macos-x86_64
          uv venv --python cpython-3.11-macos-x86_64 .venv-x86
          uv pip install --python .venv-x86/bin/python -r requirements.txt \
            "pyobjc-framework-Cocoa" "pyobjc-framework-Quartz" pyinstaller
          .venv-x86/bin/python -c "import platform; print('x86 切片解释器架构=', platform.machine())"
          .venv-x86/bin/pyinstaller MachineVisionWorkflowAssistant.spec \
            --noconfirm --clean --distpath dist-x86 --workpath build-x86
      - name: 合并成 universal2 胖二进制
        run: |
          python3 scripts/make_universal.py \
            dist-arm/MachineVisionWorkflowAssistant.app \
            dist-x86/MachineVisionWorkflowAssistant.app \
            dist-universal/MachineVisionWorkflowAssistant.app
      - name: 校验主程序含双架构
        run: lipo -archs dist-universal/MachineVisionWorkflowAssistant.app/Contents/MacOS/MachineVisionWorkflowAssistant
      - name: Ad-hoc codesign（合并后原签名失效需重签）
        run: codesign --force --deep --sign - "dist-universal/MachineVisionWorkflowAssistant.app" || true
      - name: Zip .app bundle
        run: |
          cd dist-universal
          ditto -c -k --sequesterRsrc --keepParent \
            "MachineVisionWorkflowAssistant.app" \
            "../MachineVisionWorkflowAssistant-macos-universal2.zip"
      - name: Upload universal2 artifact
        uses: actions/upload-artifact@v5
        with:
          name: MachineVisionWorkflowAssistant-macos-universal2
          path: MachineVisionWorkflowAssistant-macos-universal2.zip
          if-no-files-found: error

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    # 只依赖稳定的两个构建；universal2 若失败不阻塞发布（其产物若已就绪仍会被 download-artifact 收进来）
    needs: [build-windows, build-macos-arm64]
    runs-on: ubuntu-latest
    steps:
      - name: Download all available artifacts
        uses: actions/download-artifact@v5
        with:
          path: artifacts
      - name: Publish Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release create "$GITHUB_REF_NAME" \
            artifacts/*/* \
            --repo "$GITHUB_REPOSITORY" \
            --title "$GITHUB_REF_NAME" \
            --generate-notes
